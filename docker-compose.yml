services:
  shortswitch:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Europe/Riga}
      PORT: 3000
      PUBLIC_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
      APP_NAME: shortswitch
      APP_DESCRIPTION: URL shortener.
      DATABASE_PATH: /app/data/shortswitch.db
      APP_DATA_DIR: /app/data
      SESSION_COOKIE_NAME: shortswitch_session
      PENDING_AUTH_COOKIE_NAME: shortswitch_pending_auth
      SESSION_TTL_HOURS: 720
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: lax
      ENABLE_CSP: "true"
      ADMIN_EMAIL: test@test.en
      ADMIN_PASSWORD: $${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_NAME: admin
      RESET_ADMIN: "false"
      LOG_LEVEL: info
      LOG_PRETTY: "true"
      MIN_SLUG_LENGTH: 3
      MAX_SLUG_LENGTH: 64
      SLUG_ALLOWED_CHARS: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789
      LOGIN_MAX_FAILED_ATTEMPTS: 5
      LOGIN_ATTEMPT_WINDOW_MINUTES: 10
      LOGIN_BLOCK_MINUTES: 15
      PROTECTED_LINK_MAX_FAILED_ATTEMPTS: 5
      PROTECTED_LINK_ATTEMPT_WINDOW_MINUTES: 10
      PROTECTED_LINK_BLOCK_MINUTES: 15
      API_RATE_LIMIT_ENABLED: "false"
      API_RATE_LIMIT_MAX_REQUESTS: 300
      API_RATE_LIMIT_WINDOW_MINUTES: 1
      LINK_CREATE_RATE_LIMIT_ENABLED: "false"
      LINK_CREATE_MAX_REQUESTS: 30
      LINK_CREATE_WINDOW_MINUTES: 60
      REDIRECT_RATE_LIMIT_ENABLED: "false"
      REDIRECT_RATE_LIMIT_MAX_REQUESTS: 600
      REDIRECT_RATE_LIMIT_WINDOW_MINUTES: 1
      REDIRECT_RATE_LIMIT_BLOCK_MINUTES: 10
      LIVE_SUBMIT_MAX_REQUESTS: 60
      LIVE_SUBMIT_WINDOW_MINUTES: 1
      BOARD_RATE_LIMIT_WINDOW_MINUTES: 1
      BOARD_RATE_LIMIT_BLOCK_MINUTES: 2
      BOARD_PUBLIC_READ_IP_MAX_REQUESTS: 1000
      BOARD_PUBLIC_READ_BOARD_MAX_REQUESTS: 2000
      BOARD_PUBLIC_MUTATION_IP_MAX_REQUESTS: 600
      BOARD_PUBLIC_MUTATION_SESSION_MAX_REQUESTS: 60
      BOARD_CARD_CREATE_IP_MAX_REQUESTS: 300
      BOARD_CARD_CREATE_BOARD_MAX_REQUESTS: 500
      BOARD_CARD_CREATE_SESSION_MAX_REQUESTS: 15
      BOARD_REACTION_IP_MAX_REQUESTS: 600
      BOARD_REACTION_BOARD_MAX_REQUESTS: 2000
      BOARD_REACTION_SESSION_MAX_REQUESTS: 60
      BOARD_SSE_CONNECT_IP_MAX_REQUESTS: 300
      BOARD_SSE_CONNECT_BOARD_MAX_REQUESTS: 600
      BOARD_SSE_MAX_CONNECTIONS_PER_IP: 250
      BOARD_SSE_MAX_CONNECTIONS_PER_BOARD: 500
      BLOCK_LOCAL_URLS: "true"
      BLOCK_PRIVATE_IPS: "false"
      STORE_RAW_IP: "false"
      IP_HASH_SECRET: $${IP_HASH_SECRET:?Set IP_HASH_SECRET in .env}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      ANALYTICS_RETENTION_DAYS: 90
    volumes:
      - shortswitch-data:/app/data
    restart: unless-stopped

  shortswitch-test:
    build:
      context: .
      target: build
    command: ["sh", "-c", "npm run typecheck && npm test"]
    profiles: ["test"]

volumes:
  shortswitch-data:
